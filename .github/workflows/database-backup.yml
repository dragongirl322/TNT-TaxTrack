name: Encrypted database backup
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: database-backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --omit=dev --ignore-scripts
      - name: Export, encrypt, and verify all records
        run: node scripts/database-backup.js export backup.enc
        env:
          DATABASE_URL: ${{ secrets.TNT_DATABASE_URL }}
          TNT_BACKUP_KEY: ${{ secrets.TNT_BACKUP_KEY }}
      - name: Store encrypted backup for 90 days
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: encrypted-database-backup-${{ github.run_id }}
          path: backup.enc
          if-no-files-found: error
          retention-days: 90
